services:
  postgres:
    image: postgres:16-alpine
    container_name: social_network
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: social_network_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d social_network_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: social_network_postgres_data
